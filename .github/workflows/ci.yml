name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          AGENT_MEMORY_V2_PYTHON=$(which python) \
          PYTEST_CACHE_DIR=/tmp/pytest_cache \
          bash scripts/test.sh

      - name: Run deterministic eval suite
        run: |
          AGENT_MEMORY_V2_PYTHON=$(which python) \
          python -m agent_memory_v2.eval_cli all
